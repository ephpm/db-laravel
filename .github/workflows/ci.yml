name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Tests (PHP ${{ matrix.php }}, Laravel ${{ matrix.laravel }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.2", "8.3", "8.4"]
        laravel: ["^10.0", "^11.0", "^12.0"]
        exclude:
          # Laravel 10 predates PHP 8.4 support.
          - php: "8.4"
            laravel: "^10.0"
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, mbstring
          coverage: none
          tools: composer:v2

      - name: Cache composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ matrix.php }}-${{ matrix.laravel }}-${{ hashFiles('composer.json') }}
          restore-keys: composer-${{ matrix.php }}-${{ matrix.laravel }}-

      - name: Pin the Illuminate version for this leg
        run: >
          composer require --no-update --no-interaction
          "illuminate/database:${{ matrix.laravel }}"
          "illuminate/support:${{ matrix.laravel }}"

      - name: Install dependencies
        run: composer update --prefer-dist --no-progress --no-interaction

      - name: Run PHPUnit
        run: vendor/bin/phpunit --testdox

  validate:
    name: Validate composer.json
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none
          tools: composer:v2

      # Validate the committed composer.json on a pristine checkout. This
      # library ships no composer.lock, so validation runs on the manifest
      # alone — deliberately separate from the test matrix, whose per-leg
      # `composer update` writes a version-pinned lock that would otherwise
      # trip the lock content-hash check.
      - name: Validate composer.json
        run: composer validate --strict
